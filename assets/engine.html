<title>__TITLE__</title>
<style>
:root{
  /* Foundry — the built-in default. Override any of these in your own theme.css.
     Roles, not names: --brass draws the lines, --coral is the one accent meaning
     "live / selected / now", --parch is body text, --ground is the page. */
  --ground:#0F0D0B; --floor:#1B1713; --plate:#15120F; --plate2:#1A1612;
  --brass:#C8A24A; --parch:#EAE0CB; --stone:#8B8172; --dim:#5E564B;
  --coral:#E2542F; --rule:#2A241D;
  --serif:'Iowan Old Style',Georgia,'Times New Roman',serif;
  --mono:ui-monospace,'SF Mono',Menlo,Consolas,monospace;
}

/*__THEME__*/

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;max-width:100%;overflow-x:hidden;background:var(--ground);color:var(--parch);font-family:var(--serif);
  -webkit-font-smoothing:antialiased;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
:focus-visible{outline:1px solid var(--coral);outline-offset:2px}

.shell{display:grid;grid-template-rows:auto auto 1fr;grid-template-columns:minmax(0,1fr);height:100dvh}
.topbar{display:flex;align-items:center;flex-wrap:wrap;gap:16px 28px;padding:12px 20px;
  border-bottom:1px solid var(--rule);background:var(--plate)}
.mark{display:flex;align-items:baseline;gap:10px;flex:0 0 auto}
.mark b{font-family:var(--serif);font-size:19px;font-weight:600;letter-spacing:.02em}
.mark span{font-family:var(--mono);font-size:9.5px;letter-spacing:.22em;color:var(--stone);text-transform:uppercase}
.stats{display:flex;gap:22px;flex:1 1 240px;min-width:0;overflow-x:auto;scrollbar-width:none}
.stats::-webkit-scrollbar{display:none}
.stat{font-family:var(--mono);font-size:9.5px;letter-spacing:.16em;color:var(--dim);white-space:nowrap}
.stat b{display:block;color:var(--parch);font-size:13px;letter-spacing:.06em;font-weight:400;
  font-variant-numeric:tabular-nums;margin-top:3px}
.runbar{display:flex;gap:8px;flex:0 0 auto}
.rbtn{font-family:var(--mono);font-size:9.5px;letter-spacing:.16em;padding:7px 12px;
  border:1px solid var(--rule);color:var(--stone);transition:color .15s,border-color .15s}
.rbtn:hover{color:var(--parch);border-color:var(--dim)}
.rbtn.cta{color:var(--parch);border-color:color-mix(in srgb,var(--coral) 40%,var(--rule))}
.rbtn.cta:hover{border-color:var(--coral);color:var(--coral)}
.rbtn.on{color:#120E0B;font-weight:600;background:var(--coral);border-color:var(--coral)}

.body{display:grid;grid-template-columns:var(--rail-width,236px) minmax(0,1fr) var(--panel-width,372px);min-height:0;min-width:0}
.rail{min-width:0;border-right:1px solid var(--rule);background:var(--plate);overflow-y:auto;padding:14px 0 40px}
.ghead{font-family:var(--mono);font-size:9px;letter-spacing:.2em;color:var(--dim);
  padding:16px 16px 7px;display:flex;justify-content:space-between}
.item{display:flex;gap:9px;align-items:center;width:100%;text-align:left;padding:5px 16px 5px 13px;
  border-left:3px solid transparent;color:var(--stone);font-family:var(--mono);font-size:10.5px;
  letter-spacing:.04em;transition:color .12s,background .12s}
.item:hover{color:var(--parch);background:var(--plate2)}
.item.sel{color:var(--parch);background:var(--plate2);border-left-color:var(--coral)}
.dot{width:7px;height:7px;flex:0 0 auto;transform:rotate(45deg)}
.item em{font-style:normal;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.stage{position:relative;min-width:0;background:
  radial-gradient(120% 90% at 50% 22%,var(--floor) 0%,var(--ground) 68%)}
canvas{display:block;width:100%;height:100%;touch-action:none;cursor:grab}
canvas.drag{cursor:grabbing}
.hint{position:absolute;left:16px;bottom:12px;font-family:var(--mono);font-size:9px;
  letter-spacing:.15em;color:var(--dim);pointer-events:none}
.zoom{position:absolute;right:14px;bottom:12px;display:flex;flex-direction:column;gap:6px}
.zoom button{width:26px;height:26px;border:1px solid var(--rule);color:var(--stone);
  font-family:var(--mono);font-size:12px;line-height:1;background:var(--plate)}
.zoom button:hover{color:var(--parch)}
.caption{position:absolute;left:0;right:0;bottom:0;padding:16px 18px 22px;
  background:linear-gradient(180deg,transparent 0%,var(--ground) 58%);
  display:none;pointer-events:none}
.caption.on{display:block}
.caption.on~.zoom{bottom:104px}
.caption.on~.hint{opacity:0}
.caption .num{font-family:var(--mono);font-size:9px;letter-spacing:.2em;color:var(--coral)}
.caption p{margin:5px 0 0;font-size:16px;line-height:1.45;max-width:60ch;text-wrap:balance}

.panel{border-left:1px solid var(--rule);background:var(--plate);overflow-y:auto;padding:0 0 48px}
.tabs{display:flex;position:sticky;top:0;background:var(--plate);border-bottom:1px solid var(--rule);z-index:2}
.tab{flex:1;padding:13px 8px;font-family:var(--mono);font-size:9px;letter-spacing:.18em;
  color:var(--dim);border-bottom:1px solid transparent;margin-bottom:-1px}
.tab:hover{color:var(--stone)}
.tab.on{color:var(--parch);border-bottom-color:var(--coral)}
.pad{padding:22px 24px}
.eyebrow{font-family:var(--mono);font-size:9px;letter-spacing:.2em;display:flex;align-items:center;gap:8px}
h2{margin:9px 0 0;font-size:27px;font-weight:500;letter-spacing:-.01em;line-height:1.12;text-wrap:balance}
.sub{margin:7px 0 0;font-family:var(--mono);font-size:10px;letter-spacing:.06em;color:var(--dim)}
.prose p{font-size:15.5px;line-height:1.62;color:color-mix(in srgb,var(--parch) 84%,var(--ground));margin:16px 0 0;max-width:62ch}
.prose p strong{color:var(--parch);font-weight:600}
.lbl{font-family:var(--mono);font-size:9px;letter-spacing:.2em;color:var(--dim);
  margin:26px 0 10px;padding-bottom:7px;border-bottom:1px solid var(--rule)}
.file{display:flex;justify-content:space-between;gap:12px;font-family:var(--mono);font-size:10.5px;
  color:var(--stone);padding:5px 0}
.file span{color:var(--dim);font-variant-numeric:tabular-nums;flex:0 0 auto}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-family:var(--mono);font-size:9px;letter-spacing:.1em;padding:4px 8px;
  border:1px solid var(--rule);color:var(--stone)}
.links{display:flex;flex-direction:column;gap:2px;margin-top:2px}
.link{text-align:left;font-family:var(--mono);font-size:10.5px;color:var(--stone);padding:5px 0;
  display:flex;gap:8px;align-items:center}
.link:hover{color:var(--coral)}
.link i{font-style:normal;color:var(--dim)}
.empty{color:var(--dim);font-size:15px;line-height:1.6;margin-top:16px}

  body{overflow:auto}

}

.legend{position:absolute;left:16px;top:12px;display:flex;flex-wrap:wrap;gap:6px 18px;max-width:74%;
  font-family:var(--mono);font-size:8.5px;letter-spacing:.16em;color:var(--dim);pointer-events:none}
.search{position:sticky;top:0;z-index:3;background:var(--plate);padding:12px 14px;border-bottom:1px solid var(--rule)}
.search input{width:100%;background:var(--ground);border:1px solid var(--rule);color:var(--parch);
  font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;padding:8px 9px}
.search input::placeholder{color:#544C43;letter-spacing:.16em;text-transform:uppercase;font-size:9px}
.caption .num{display:flex;gap:14px;align-items:baseline}

.bar{height:2px;background:var(--rule);margin-top:12px;max-width:62ch}
.bar i{display:block;height:2px;width:0;background:var(--coral)}
.why{margin-top:22px;padding-left:13px;border-left:2px solid var(--rule)}

.why h4{margin:0;font-family:var(--mono);font-size:9px;letter-spacing:.2em;color:var(--dim);font-weight:400}

.big{display:grid;margin-top:12px}
.big button{display:flex;justify-content:space-between;gap:12px;align-items:baseline;text-align:left;

  letter-spacing:.08em;color:var(--dim)}

.ghead,.lbl,.why h4,.legend,.hint{font-size:11px}
.item{padding-top:7px;padding-bottom:7px}

.file,.chip{font-size:12px}.file{flex-wrap:wrap}.file span:first-child{overflow-wrap:anywhere;flex-shrink:1}
.rbtn.on,.rbtn.on:hover{color:var(--ground)}
.stats{flex-basis:400px;min-width:min(100%,400px)}
button:disabled{opacity:.4;cursor:default}
.body{grid-template-rows:minmax(0,1fr)}
.rail{grid-column:1;grid-row:1}.stage{grid-column:2;grid-row:1;min-height:0}.panel{grid-column:3;grid-row:1}

.body.hide-rail .rail,.body.hide-panel .panel{display:none}
.journey{background:var(--plate);border-bottom:1px solid var(--rule);padding:10px 20px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;font:12px var(--mono)}
.journey select{font:inherit;color:var(--parch);background:var(--ground);border:1px solid var(--rule);padding:6px}
.chapters{display:flex;gap:6px;flex-wrap:wrap}.chapters button[aria-current="step"]{color:var(--parch);border-color:var(--coral)}
.scrubber{display:flex;align-items:center;gap:8px;flex:1 1 280px;min-width:260px}.scrubber output{flex-shrink:0;min-width:11ch;white-space:nowrap}.scrubber input{min-width:80px;flex:1;width:0;accent-color:var(--coral)}
.search-status{display:flex;justify-content:space-between;align-items:center;gap:6px;margin-top:8px;font:11px var(--mono);color:var(--stone)}
.search-status button{padding:4px;text-decoration:underline}
.zoom{flex-direction:row;flex-wrap:wrap;justify-content:flex-end;max-width:100%}
.zoom button{width:auto;min-width:32px;height:32px;padding:0 8px}
.hint{bottom:54px;max-width:90%}.legend{max-width:95%}
.caption{padding-bottom:58px}.caption.on~.zoom{bottom:12px}
.edge-info{position:absolute;top:52px;left:16px;right:16px;width:fit-content;max-width:calc(100% - 32px);padding:8px 12px;background:var(--plate);border:1px solid var(--rule);font:12px/1.5 var(--mono);pointer-events:none}
.edge-info[hidden]{display:none}

@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="shell">
  <header class="topbar">
    <div class="mark"><b id="m-name"></b><span id="m-tag"></span></div>

<script>
/*__DATA__*/

N.forEach(n=>{const x=COPY[n.id];if(x){n.d=x[0];n.t=x[1];n.s1=x[2];n.s2=x[3];}});
const CH=(typeof META!=='undefined'&&META.chapters)?META.chapters:[[0,'START']];
const chapterOf=i=>{let c=CH[0][1];for(const k of CH)if(i>=k[0])c=k[1];return c;};
let visited={};
function related(id){const s=new Set([id]);E.forEach(e=>{if(e[0]===id)s.add(e[1]);if(e[1]===id)s.add(e[0]);});return s;}

/* ---------- canvas ---------- */
const TK={};
function readTokens(){
  const cs=getComputedStyle(document.documentElement),g=n=>cs.getPropertyValue(n).trim();
  const rgb=h=>{h=(h||'#888').replace('#','');
    if(h.length===3)h=h.split('').map(c=>c+c).join('');
    return [0,2,4].map(i=>parseInt(h.slice(i,i+2),16)).join(',');};
  TK.brass=rgb(g('--brass'));TK.coral=rgb(g('--coral'));TK.parch=rgb(g('--parch'));
  TK.ground=rgb(g('--ground'));
  TK.coralHex=g('--coral');TK.parchHex=g('--parch');TK.groundHex=g('--ground');
  TK.stoneHex=g('--stone');TK.hotHex=g('--parch');
}
const cv=document.getElementById('cv'),ctx=cv.getContext('2d');
const RM=matchMedia('(prefers-reduced-motion:reduce)').matches;
const TW=62,TH=31,ZS=1;
let cam={x:0,y:0,s:1},sel=null,hov=null,W=0,H=0,dpr=1;const LATE=[];
const byId={};N.forEach(n=>byId[n.id]=n);
const iso=(x,y,z)=>({x:(x-y)*TW/2,y:(x+y)*TH/2-z*ZS});
const ctr=n=>({x:n.x+n.w/2,y:n.y+n.h/2});

function paths(){for(const e of E){const a=byId[e[0]],b=byId[e[1]];const A=ctr(a),B=ctr(b);
  let p;
  if(Math.abs(A.y-B.y)<.4||Math.abs(A.x-B.x)<.4)p=[A,B];
  else{const mx=(A.x+B.x)/2;p=[A,{x:mx,y:A.y},{x:mx,y:B.y},B];}
  e.p=p;let L=0;for(let i=1;i<p.length;i++)L+=Math.hypot(p[i].x-p[i-1].x,p[i].y-p[i-1].y);
  e.L=L;e.t=Math.random();}}
paths();
function at(e,t){let d=t*e.L,p=e.p;
  for(let i=1;i<p.length;i++){const l=Math.hypot(p[i].x-p[i-1].x,p[i].y-p[i-1].y);
    if(d<=l){const k=l?d/l:0;return{x:p[i-1].x+(p[i].x-p[i-1].x)*k,y:p[i-1].y+(p[i].y-p[i-1].y)*k};}d-=l;}
  return p[p.length-1];}

function resize(){dpr=Math.min(devicePixelRatio||1,2);const r=cv.getBoundingClientRect();
  W=r.width;H=r.height;cv.width=W*dpr;cv.height=H*dpr;}
function fit(){fitNodes(N);}
function fitNodes(nodes){const pts=[];nodes.forEach(n=>{for(const[a,b]of[[0,0],[n.w,0],[0,n.h],[n.w,n.h]]){
    pts.push(iso(n.x+a,n.y+b,0));pts.push(iso(n.x+a,n.y+b,n.z));}});
  const xs=pts.map(p=>p.x),ys=pts.map(p=>p.y);
  const x0=Math.min(...xs),x1=Math.max(...xs),y0=Math.min(...ys),y1=Math.max(...ys);
  cam.s=Math.min((W-46)/(x1-x0),(H-160)/(y1-y0));cam.s=Math.max(.35,Math.min(cam.s,1.7));
  cam.x=W/2-((x0+x1)/2)*cam.s;cam.y=H/2-((y0+y1)/2)*cam.s;}

function sp(x,y,z){const p=iso(x,y,z);return{x:p.x*cam.s+cam.x,y:p.y*cam.s+cam.y};}
function poly(pts,fill,stroke,lw){ctx.beginPath();pts.forEach((p,i)=>i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y));
  ctx.closePath();if(fill){ctx.fillStyle=fill;ctx.fill();}if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=lw||1;ctx.stroke();}}
function hex(h,a){const r=parseInt(h.slice(1,3),16),g=parseInt(h.slice(3,5),16),b=parseInt(h.slice(5,7),16);
  return`rgba(${r},${g},${b},${a})`;}

let active=new Set(),liveEdge=null,liveT=0,step=-1,playing=false;
let matches=null,hoverEdge=null,selectedEdge=null;
let showIcons=false,showAws=false;
const AWS_BADGES={
  'api-gateway':['API','API Gateway','#C45500'],'cloudfront':['CF','CloudFront','#8C4FFF'],
  'dynamodb':['DDB','DynamoDB','#4053D6'],'ecs':['ECS','ECS','#D86613'],
  'eks':['EKS','EKS','#D86613'],'lambda':['λ','Lambda','#F28C28'],
  'rds':['RDS','RDS','#527FFF'],'s3':['S3','S3','#569A31'],
  'sns':['SNS','SNS','#D86613'],'sqs':['SQS','SQS','#D86613'],
  'step-functions':['SFN','Step Functions','#D86613'],'eventbridge':['EVB','EventBridge','#D86613'],
  'elasticache':['EC','ElastiCache','#C925D1'],'fargate':['F','Fargate','#D86613']
};

function draw(){
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.clearRect(0,0,W,H);
  ctx.lineWidth=1;ctx.strokeStyle=`rgba(${TK.brass},0.05)`;
  for(let i=-4;i<=44;i+=2){let a=sp(i,-4,0),b=sp(i,20,0);ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke();
    a=sp(-4,i*0.5,0);b=sp(44,i*0.5,0);ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke();}
  laneLabels();
  const focus=matches||(sel&&!playing?related(sel):null);
  for(const e of E){
    const on=liveEdge===e,rel=sel&&(e[0]===sel||e[1]===sel);
    const dim=(matches?!(matches.has(e[0])||matches.has(e[1])):(focus&&!rel))||(playing&&!on);
    ctx.beginPath();e.p.forEach((p,i)=>{const s=sp(p.x,p.y,0);i?ctx.lineTo(s.x,s.y):ctx.moveTo(s.x,s.y);});
    ctx.strokeStyle=on?`rgba(${TK.coral},0.95)`:rel?`rgba(${TK.parch},0.5)`:dim?`rgba(${TK.brass},0.07)`:e[2]?`rgba(${TK.brass},0.65)`:`rgba(${TK.brass},0.38)`;
    ctx.lineWidth=on?1.8:rel?1.2:1;ctx.stroke();
    if(rel||on){e.p.forEach(p=>{const s=sp(p.x,p.y,0);poly([{x:s.x,y:s.y-2.5},{x:s.x+2.5,y:s.y},{x:s.x,y:s.y+2.5},{x:s.x-2.5,y:s.y}],on?TK.coralHex:`rgba(${TK.parch},.5)`);});}
    if(!RM&&(on||(e[2]&&!dim))){
      const t=on?liveT:e.t;const q=at(e,Math.min(t,1));const s=sp(q.x,q.y,0);
      const r=on?4.5:2.4;
      if(on){ctx.shadowColor=TK.coralHex;ctx.shadowBlur=14;}
      poly([{x:s.x,y:s.y-r},{x:s.x+r,y:s.y},{x:s.x,y:s.y+r},{x:s.x-r,y:s.y}],on?TK.coralHex:`rgba(${TK.brass},0.5)`);
      ctx.shadowBlur=0;
    }
  }
  const order=[...N].sort((a,b)=>(a.x+a.w/2+a.y+a.h/2)-(b.x+b.w/2+b.y+b.h/2));
  LATE.length=0;
  for(const n of order)block(n,focus);
  drawArrows();
  LATE.forEach(f=>f());
  ctx.setTransform(1,0,0,1,0,0);
}

// Place static arrows on exposed floor segments so blocks cannot hide direction.
function edgeAnchor(e,boxes){
  for(const t of [.5,.4,.6,.3,.7,.2,.8]){
    const a=at(e,t),p=sp(a.x,a.y,0);
    if(p.x<12||p.x>W-12||p.y<12||p.y>H-12)continue;
    if(!boxes.some(b=>p.x>b.x0-7&&p.x<b.x1+7&&p.y>b.y0-7&&p.y<b.y1+7))return {p,t};
  }
  return null;
}
function drawArrows(){
  const boxes=N.map(nodeBox);
  for(const e of E){
    const a=edgeAnchor(e,boxes);if(!a)continue;
    const near=at(e,Math.min(1,a.t+.01)),b=sp(near.x,near.y,0),angle=Math.atan2(b.y-a.p.y,b.x-a.p.x);
    const hot=e===liveEdge||e===hoverEdge||e===selectedEdge;
    const relevant=(!matches||matches.has(e[0])||matches.has(e[1]))&&(!sel||e[0]===sel||e[1]===sel);
    ctx.save();ctx.translate(a.p.x,a.p.y);ctx.rotate(angle);
    poly([{x:6,y:0},{x:-4,y:-4},{x:-4,y:4}],hot?TK.coralHex:`rgba(${TK.brass},${relevant?.85:.18})`);ctx.restore();
  }
}
function pickEdge(pt){
  let best=null,distance=8;
  for(const e of E)for(let i=1;i<e.p.length;i++){
    const a=sp(e.p[i-1].x,e.p[i-1].y,0),b=sp(e.p[i].x,e.p[i].y,0),dx=b.x-a.x,dy=b.y-a.y;
    const t=Math.max(0,Math.min(1,((pt.x-a.x)*dx+(pt.y-a.y)*dy)/(dx*dx+dy*dy||1)));
    const d=Math.hypot(pt.x-a.x-t*dx,pt.y-a.y-t*dy);if(d<distance){best=e;distance=d;}
  }
  return best;
}
function showEdge(){
  const e=hoverEdge||selectedEdge||liveEdge,el=document.getElementById('edge-info');
  el.hidden=!e;if(e)el.textContent=byId[e[0]].n+' → '+byId[e[1]].n;
}
function centerNode(id){
  const n=byId[id],c=ctr(n),p=iso(c.x,c.y,n.z/2);
  cam.x=W/2-p.x*cam.s;cam.y=H*.46-p.y*cam.s;
}

function nodeBox(n){
  const p=[sp(n.x,n.y,n.z),sp(n.x+n.w,n.y,n.z),sp(n.x+n.w,n.y+n.h,n.z),sp(n.x,n.y+n.h,n.z),
           sp(n.x,n.y+n.h,0),sp(n.x+n.w,n.y+n.h,0),sp(n.x+n.w,n.y,0)];
  const xs=p.map(q=>q.x),ys=p.map(q=>q.y);
  return{x0:Math.min(...xs),x1:Math.max(...xs),y0:Math.min(...ys),y1:Math.max(...ys)};}
function hits(r,b){return!(r.x1<b.x0||r.x0>b.x1||r.y1<b.y0||r.y0>b.y1);}
function laneLabels(){
  if(cam.s<0.4)return;
  ctx.font='12px ui-monospace,Menlo,monospace';ctx.textAlign='center';ctx.textBaseline='middle';
  const boxes=N.map(nodeBox);const placed=[];
  for(const g of groups){
    if(g==='ledger')continue;
    const ns=N.map((n,i)=>[n,boxes[i]]).filter(k=>k[0].g===g);
    const cx=ns.reduce((a,k)=>a+(k[1].x0+k[1].x1)/2,0)/ns.length;
    let top=Math.min(...ns.map(k=>k[1].y0));
    const t=G[g].s,w=ctx.measureText(t).width;
    let r,ok=false;
    for(let k=0;k<5;k++){
      r={x0:cx-w/2-8,x1:cx+w/2+8,y0:top-30-k*17,y1:top-12-k*17};
      if(!boxes.some(b=>hits(r,b))&&!placed.some(b=>hits(r,b))){ok=true;break;}
    }
    if(!ok||r.y0<44)continue;
    placed.push(r);
    const y=(r.y0+r.y1)/2;
    if(!ok){ctx.fillStyle=`rgba(${TK.ground},.82)`;ctx.fillRect(r.x0,r.y0,r.x1-r.x0,r.y1-r.y0);}
    ctx.fillStyle=`rgba(${TK.parch},0.6)`;ctx.fillText(t,cx,y);
    ctx.strokeStyle=`rgba(${TK.parch},0.10)`;ctx.lineWidth=1;
    ctx.beginPath();ctx.moveTo(cx-w/2,r.y1+3);ctx.lineTo(cx+w/2,r.y1+3);ctx.stroke();
  }
}


function block(n,focus){
  const col=G[n.g].c,isSel=sel===n.id,isHov=hov===n.id,isAct=active.has(n.id),num=visited[n.id];
  const lit=isSel||isAct;
  let a=1;
  if(matches)a=matches.has(n.id)?1:.18;
  else if(playing)a=(isAct||num)?1:.28;
  else if(focus)a=focus.has(n.id)?1:.28;
  ctx.globalAlpha=a;
  const T=[sp(n.x,n.y,n.z),sp(n.x+n.w,n.y,n.z),sp(n.x+n.w,n.y+n.h,n.z),sp(n.x,n.y+n.h,n.z)];
  const Bt=[sp(n.x,n.y+n.h,0),sp(n.x+n.w,n.y+n.h,0),sp(n.x+n.w,n.y,0)];
  const left=[T[3],T[2],Bt[1],Bt[0]];
  const right=[T[2],T[1],Bt[2],Bt[1]];
  const edge=lit?TK.coralHex:isHov?hex(col,.95):hex(col,.5);
  const lw=lit?1.7:isHov?1.3:1;
  if(lit){ctx.shadowColor=`rgba(${TK.coral},.55)`;ctx.shadowBlur=26;}
  poly(left,lit?hex(col,.34):hex(col,.18),edge,lw);
  ctx.shadowBlur=0;
  poly(right,lit?hex(col,.24):hex(col,.11),edge,lw);
  ctx.save();ctx.beginPath();right.forEach((p,i)=>i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y));ctx.closePath();ctx.clip();
  ctx.strokeStyle=lit?`rgba(${TK.coral},.35)`:hex(col,.16);ctx.lineWidth=1;
  const xs=right.map(p=>p.x),ys=right.map(p=>p.y);
  for(let x=Math.min(...xs)-200;x<Math.max(...xs)+200;x+=7){
    ctx.beginPath();ctx.moveTo(x,Math.min(...ys)-10);ctx.lineTo(x+200,Math.min(...ys)+190);ctx.stroke();}
  ctx.restore();
  poly(T,lit?hex(col,.58):isHov?hex(col,.42):hex(col,.30),lit?TK.coralHex:edge,lw);
  n._T=T;n._L=left;n._R=right;
  const cx=(T[0].x+T[2].x)/2,cy=(T[0].y+T[2].y)/2;
  const wide=Math.abs(T[1].x-T[3].x);
  ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillStyle=TK.parchHex;
  const fs=Math.max(11,11*cam.s);
  ctx.font=fs+'px ui-monospace,Menlo,monospace';
  const available=wide-14;
  const iconSize=Math.max(14,Math.min(22,18*cam.s));
  const iconFont=iconSize+'px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif';
  let iconWidth=0;
  const awsBadge=showAws&&typeof n.aws==='string'?AWS_BADGES[n.aws.toLowerCase()]:null;
  let awsWidth=0;
  if(awsBadge){ctx.save();ctx.font='600 '+Math.max(8,9*cam.s)+'px ui-monospace,Menlo,monospace';awsWidth=Math.max(22,ctx.measureText(awsBadge[0]).width+10);ctx.restore();}
  if(showIcons&&typeof n.icon==='string'&&n.icon){
    ctx.save();ctx.font=iconFont;iconWidth=ctx.measureText(n.icon).width;ctx.restore();
    // Keep the identifying code visible even on small roofs.
    if(iconWidth+5+ctx.measureText(n.c).width+awsWidth+5>available)iconWidth=0;
  }
  const gap=iconWidth?5:0;
  const awsGap=awsWidth?5:0;
  const label=(n.d&&ctx.measureText(n.d).width+iconWidth+gap+awsWidth+awsGap<available)?n.d:n.c;
  if(cam.s>.34){
    const textWidth=ctx.measureText(label).width, total=iconWidth+gap+textWidth+awsGap+awsWidth;
    const start=cx-total/2;
    if(iconWidth){
      ctx.save();ctx.font=iconFont;ctx.fillText(n.icon,start+iconWidth/2,cy);ctx.restore();
      ctx.fillText(label,start+iconWidth+gap+textWidth/2,cy);
    }else ctx.fillText(label,start+textWidth/2,cy);
    if(awsBadge){
      const ax=start+iconWidth+gap+textWidth+awsGap;
      ctx.save();ctx.fillStyle=awsBadge[2];ctx.globalAlpha=Math.min(1,a+.15);ctx.fillRect(ax,cy-8,awsWidth,16);
      ctx.fillStyle='#fff';ctx.font='600 '+Math.max(8,9*cam.s)+'px ui-monospace,Menlo,monospace';ctx.textAlign='center';ctx.fillText(awsBadge[0],ax+awsWidth/2,cy+.5);ctx.restore();
    }
  }
  if(num)LATE.push(()=>{
    const p=T[0];
    ctx.beginPath();ctx.arc(p.x,p.y,9,0,6.284);ctx.fillStyle=TK.coralHex;ctx.fill();
    ctx.strokeStyle=TK.groundHex;ctx.lineWidth=1.5;ctx.stroke();
    ctx.fillStyle=TK.groundHex;ctx.font='600 9px ui-monospace,Menlo,monospace';
    ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(String(num),p.x,p.y+.5);
  });
  if(isSel||isHov)LATE.push(()=>{
    const t=n.n.toUpperCase(),sub=n.t||'';
    ctx.textAlign='center';
    ctx.font='12px ui-monospace,Menlo,monospace';
    const w=Math.min(W-16,Math.max(ctx.measureText(t).width,sub?ctx.measureText(sub).width:0)+22),h=sub?44:28;
    const px=Math.max(w/2+8,Math.min(W-w/2-8,cx)),py=Math.max(88,T[0].y-16-h);
    ctx.fillStyle=`rgba(${TK.ground},.96)`;ctx.fillRect(px-w/2,py,w,h);
    ctx.strokeStyle=lit?TK.coralHex:hex(col,.75);ctx.lineWidth=1;ctx.strokeRect(px-w/2,py,w,h);
    ctx.textBaseline='middle';ctx.fillStyle=lit?TK.hotHex:TK.parchHex;
    ctx.fillText(t,px,py+(sub?13:13));
    if(sub){ctx.fillStyle=TK.stoneHex;ctx.fillText(sub,px,py+30,w-22);}
    ctx.beginPath();ctx.moveTo(px,py+h);ctx.lineTo(cx,T[0].y-2);ctx.strokeStyle=hex(col,.5);ctx.stroke();
  });
  ctx.globalAlpha=1;
}


const inPoly=(p,pt)=>{let c=false;for(let i=0,j=p.length-1;i<p.length;j=i++){
  if((p[i].y>pt.y)!==(p[j].y>pt.y)&&pt.x<(p[j].x-p[i].x)*(pt.y-p[i].y)/(p[j].y-p[i].y)+p[i].x)c=!c;}return c;};
function pick(pt){const o=[...N].sort((a,b)=>(b.x+b.y)-(a.x+a.y));
  for(const n of o){if(!n._T)continue;if(inPoly(n._T,pt)||inPoly(n._L,pt)||inPoly(n._R,pt))return n.id;}return null;}

function syncJourney(){
  scrubber.value=Math.max(1,step+1);
  document.getElementById('step-position').textContent=step<0?'Not started':(step+1)+' / '+STEPS.length;
  document.getElementById('btn-prev').disabled=step<=0;

function goStep(i){
  if(i>=STEPS.length){
    stop();complete=true;active=new Set();liveEdge=null;
    capnum.textContent='RUN COMPLETE';capch.textContent='';capbar.style.width='100%';captxt.textContent=META.done;
    syncJourney();showEdge();return;
  }
  complete=false;step=Math.max(0,i);pausedElapsed=0;stepStart=performance.now();
  q.value='';filterBlocks();selectedEdge=null;
  const [id,txt,edge]=STEPS[step];
  visited={};for(let k=0;k<=step;k++)visited[STEPS[k][0]]=k+1;
  active=new Set([id]);liveEdge=edge?E.find(e=>e[0]===edge[0]&&e[1]===edge[1]):null;
  liveT=0;if(liveEdge)active.add(liveEdge[0]);
  choose(id,true);cap.classList.add('on');
  capnum.textContent=`STEP ${String(step+1).padStart(2,'0')} / ${STEPS.length}`;
  capch.textContent=chapterOf(step);capbar.style.width=((step+1)/STEPS.length*100)+'%';captxt.textContent=txt;
  syncJourney();showEdge();
}

let drag=null;

cv.addEventListener('pointermove',e=>{
  const r=cv.getBoundingClientRect(),pt={x:e.clientX-r.left,y:e.clientY-r.top};
  if(drag){const dx=e.clientX-drag.x,dy=e.clientY-drag.y;drag.moved=Math.hypot(dx,dy);
    cam.x=drag.cx+dx;cam.y=drag.cy+dy;return;}
  const h=pick(pt);hov=h;hoverEdge=h?null:pickEdge(pt);cv.style.cursor=(h||hoverEdge)?'pointer':'grab';showEdge();});
cv.addEventListener('pointerup',e=>{
  const r=cv.getBoundingClientRect(),pt={x:e.clientX-r.left,y:e.clientY-r.top};
  const moved=drag?drag.moved:99;drag=null;cv.classList.remove('drag');
  if(moved<4){const h=pick(pt);if(h)inspect(h);else{const edge=pickEdge(pt);if(edge){inspect(edge[0]);selectedEdge=edge;showEdge();}}}});
cv.addEventListener('pointerleave',()=>{drag=null;hov=null;hoverEdge=null;showEdge();cv.classList.remove('drag');});
cv.addEventListener('wheel',e=>{e.preventDefault();zoom(e.deltaY<0?1.1:1/1.1,e.offsetX,e.offsetY);},{passive:false});
function zoom(k,ox,oy){ox=ox??W/2;oy=oy??H/2;const s=Math.max(.35,Math.min(cam.s*k,2.4));
  cam.x=ox-(ox-cam.x)*(s/cam.s);cam.y=oy-(oy-cam.y)*(s/cam.s);cam.s=s;}
document.getElementById('zin').addEventListener('click',()=>zoom(1.2));
document.getElementById('zout').addEventListener('click',()=>zoom(1/1.2));

addEventListener('keydown',e=>{
  if(e.target?.closest('input,select,textarea,button,a,[contenteditable]'))return;
  if(e.key==='ArrowRight'){e.preventDefault();walk(1);}
  else if(e.key==='ArrowLeft'){e.preventDefault();walk(-1);}
  else if(e.key===' '){e.preventDefault();start();}
  else if(e.key==='Escape'){stop();step=-1;complete=false;liveEdge=null;selectedEdge=null;hoverEdge=null;cap.classList.remove('on');active=new Set();visited={};sel=null;syncJourney();showEdge();document.getElementById('focus-node').disabled=true;
    rail.querySelectorAll('.item').forEach(b=>b.classList.remove('sel'));render();}
});

/* ---------- loop ---------- */
let last=performance.now();
function frame(now){
  const dt=Math.min((now-last)/1000,.05);last=now;
  if(!RM)for(const e of E){if(e[2]){e.t+=dt*0.055;if(e.t>1)e.t=0;}}
  if(playing){
    const el=now-stepStart;
    liveT=liveEdge?Math.min(el/1100,1):1;
    if(el>Number(pace.value))goStep(step+1);
  }
  draw();requestAnimationFrame(frame);
}
function boot(){readTokens();resize();fit();draw();}
new ResizeObserver(()=>{const r=cv.getBoundingClientRect();if(r.width<2||r.height<2)return;const oldW=W,oldH=H;resize();cam.x+=(W-oldW)/2;cam.y+=(H-oldH)/2;draw();}).observe(cv.parentElement);

document.getElementById('legend').innerHTML=(META.legend||['TALLER = MORE CODE','LINE = A REAL PATH','MOVING MARK = ONE UNIT OF WORK']).map(t=>`<span>${t}</span>`).join('');
document.getElementById('m-name').textContent=META.name;
document.getElementById('m-tag').textContent=META.tag;
document.getElementById('btn-run').textContent=META.run;
document.getElementById('stats').innerHTML=META.stats.map(st=>{
  const v=st[1]==='#blocks'?N.length:st[1]==='#steps'?STEPS.length:st[1];
  return `<div class="stat">${st[0]}<b>${v}</b></div>`;}).join('');
filterBlocks();syncJourney();render();boot();requestAnimationFrame(frame);
</script>
