name: Atlas regression checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install development dependencies
        run: npm install --ignore-scripts
      - name: Data and inventory regressions
        run: npm test
      - name: Build both themes
        run: |
          mkdir -p work/browser-smoke
          python3 scripts/build.py examples/order-flow.data.json work/browser-smoke/atlas-foundry.html themes/foundry.css
          python3 scripts/build.py examples/order-flow.data.json work/browser-smoke/atlas-drafting.html themes/drafting.css
      - name: Install Chromium for browser checks
        run: npx playwright install --with-deps chromium
      - name: Browser smoke tests
        run: npm run test:browser
      - name: Save browser examples and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: atlas-browser-smoke
          path: work/browser-smoke
          if-no-files-found: ignore
